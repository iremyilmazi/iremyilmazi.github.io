    const projectOrder = [
      'MarketInsight TR',
      'InputHub',
      'Benchmark Çalışması',
      'Başvuru Akışı Demo',
      'KRS Parser',
      'Desktop Overlay'
    ];

    const displayProjects = projectOrder
      .map(title => projects.find(p => p.title === title))
      .filter(Boolean);

    const grid = document.getElementById('projectsGrid');
    const cardState = {};
    const langToggle = document.getElementById('langToggle');

    function getLocalizedProject(project) {
      if (currentLanguage !== 'en') return project;
      const en = projectTextEn[project.title];
      if (!en) return project;
      return {
        ...project,
        title: en.title || project.title,
        summary: en.summary || project.summary,
        tags: en.tags || project.tags
      };
    }

    function applyLanguage() {
      const dict = i18n[currentLanguage] || i18n.tr;
      document.documentElement.lang = currentLanguage;
      document.title = dict.pageTitle;

      const mainTitle = document.getElementById('projectsMainTitle');
      const mainTitleHighlight = document.getElementById('projectsMainTitleHighlight');
      const subtitle = document.getElementById('projectsSubtitle');
      const navAbout = document.getElementById('navAbout');
      const navProjects = document.getElementById('navProjects');
      const backBtn = document.getElementById('backToCvBtn');
      const footer = document.getElementById('projectsFooterText');

      if (mainTitle) {
        mainTitle.childNodes[0].nodeValue = `${dict.mainTitle} `;
      }
      if (navAbout) {
        navAbout.textContent = dict.navAbout;
        navAbout.setAttribute('href', `code.html?lang=${currentLanguage}#about`);
      }
      if (navProjects) {
        navProjects.textContent = dict.navProjects;
        navProjects.setAttribute('href', `codep.html?lang=${currentLanguage}`);
      }
      if (mainTitleHighlight) mainTitleHighlight.textContent = dict.mainTitleHighlight;
      if (subtitle) subtitle.textContent = dict.subtitle;
      if (backBtn) {
        backBtn.lastChild.textContent = ` ${dict.backToCv}`;
        backBtn.setAttribute('href', `code.html?lang=${currentLanguage}`);
      }
      if (footer) {
        footer.textContent = dict.footer;
        footer.classList.toggle('hidden', !dict.footer);
      }
      if (langToggle) langToggle.textContent = currentLanguage === 'tr' ? 'EN' : 'TR';

      const params = new URLSearchParams(window.location.search);
      params.set('lang', currentLanguage);
      const newUrl = `${window.location.pathname}?${params.toString()}${window.location.hash}`;
      window.history.replaceState({}, '', newUrl);

      renderCards();
      if (!modal.classList.contains('hidden')) renderModal();
    }

    function renderCards() {
      grid.innerHTML = displayProjects.map((p, i) => {
        const localized = getLocalizedProject(p);
        cardState[i] = cardState[i] || 0;
        return `
          <article class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden cursor-pointer" data-project-index="${i}">
            <div class="relative">
              <img src="${p.images[cardState[i]]}" alt="${localized.title} görseli" class="project-card-image w-full h-52 object-cover" data-image-for="${i}"/>
              <button class="card-prev absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-600" data-index="${i}">
                <span class="material-symbols-outlined text-[20px]">chevron_left</span>
              </button>
              <button class="card-next absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-600" data-index="${i}">
                <span class="material-symbols-outlined text-[20px]">chevron_right</span>
              </button>
              <div class="absolute bottom-3 left-1/2 -translate-x-1/2 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-900/70 text-white" data-counter-for="${i}">${cardState[i] + 1}/${p.images.length}</div>
            </div>
            <div class="p-6">
              <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">${localized.title}</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${localized.summary}</p>
              <div class="flex flex-wrap gap-2 mb-4">
                ${localized.tags.map(tag => `<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700/50 rounded text-[11px] font-semibold text-slate-600 dark:text-slate-300">${tag}</span>`).join('')}
              </div>
              <button class="text-sm font-semibold text-primary hover:underline">${(i18n[currentLanguage] || i18n.tr).detailsBtn}</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function changeCardImage(projectIndex, step) {
      const images = displayProjects[projectIndex].images;
      cardState[projectIndex] = (cardState[projectIndex] + step + images.length) % images.length;
      const img = document.querySelector(`[data-image-for="${projectIndex}"]`);
      const counter = document.querySelector(`[data-counter-for="${projectIndex}"]`);
      if (img) img.src = images[cardState[projectIndex]];
      if (counter) counter.textContent = `${cardState[projectIndex] + 1}/${images.length}`;
    }

    const modal = document.getElementById('projectModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalImage = document.getElementById('modalImage');
    const modalCounter = document.getElementById('modalCounter');
    const modalDetails = document.getElementById('modalDetails');
    const closeModal = document.getElementById('closeModal');
    const modalPrev = document.getElementById('modalPrev');
    const modalNext = document.getElementById('modalNext');
    const imageFullscreen = document.getElementById('imageFullscreen');
    const fullscreenImage = document.getElementById('fullscreenImage');
    let activeProject = 0;
    let activeImage = 0;

    function renderModal() {
      const p = displayProjects[activeProject];
      const localized = getLocalizedProject(p);
      modalTitle.textContent = localized.title;
      modalImage.src = p.images[activeImage];
      modalCounter.textContent = `${activeImage + 1}/${p.images.length}`;
      const enDetails = projectDetailsEn[p.title];
      if (currentLanguage === 'en' && enDetails) {
        modalDetails.innerHTML = enDetails;
      } else {
        modalDetails.innerHTML = p.detailsHtml || p.details.split('\n\n').map(par => `<p>${par}</p>`).join('');
      }
    }

    function openModal(index) {
      activeProject = index;
      activeImage = 0;
      renderModal();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModalFn() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function openFullscreenImage() {
      if (!modalImage || !imageFullscreen || !fullscreenImage) return;
      fullscreenImage.src = modalImage.src;
      imageFullscreen.classList.remove('hidden');
      imageFullscreen.classList.add('flex');
    }

    function closeFullscreenImage() {
      if (!imageFullscreen) return;
      imageFullscreen.classList.add('hidden');
      imageFullscreen.classList.remove('flex');
    }

    function showPrevImage() {
      const images = displayProjects[activeProject].images;
      activeImage = (activeImage - 1 + images.length) % images.length;
      renderModal();
      if (imageFullscreen && !imageFullscreen.classList.contains('hidden') && fullscreenImage) {
        fullscreenImage.src = displayProjects[activeProject].images[activeImage];
      }
    }

    function showNextImage() {
      const images = displayProjects[activeProject].images;
      activeImage = (activeImage + 1) % images.length;
      renderModal();
      if (imageFullscreen && !imageFullscreen.classList.contains('hidden') && fullscreenImage) {
        fullscreenImage.src = displayProjects[activeProject].images[activeImage];
      }
    }

    if (langToggle) {
      langToggle.addEventListener('click', () => {
        currentLanguage = currentLanguage === 'tr' ? 'en' : 'tr';
        localStorage.setItem('projectsLanguage', currentLanguage);
        applyLanguage();
      });
    }

    applyLanguage();

    grid.addEventListener('click', (e) => {
      const prevBtn = e.target.closest('.card-prev');
      const nextBtn = e.target.closest('.card-next');
      if (prevBtn) {
        e.stopPropagation();
        changeCardImage(Number(prevBtn.dataset.index), -1);
        return;
      }
      if (nextBtn) {
        e.stopPropagation();
        changeCardImage(Number(nextBtn.dataset.index), 1);
        return;
      }

      const card = e.target.closest('[data-project-index]');
      if (!card) return;
      openModal(Number(card.dataset.projectIndex));
    });

    closeModal.addEventListener('click', closeModalFn);

    modalImage.addEventListener('click', openFullscreenImage);
    imageFullscreen.addEventListener('click', closeFullscreenImage);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModalFn();
    });

    document.addEventListener('keydown', (e) => {
      const isModalOpen = !modal.classList.contains('hidden');

      if (e.key === 'Escape') {
        if (imageFullscreen && !imageFullscreen.classList.contains('hidden')) {
          closeFullscreenImage();
        } else {
          closeModalFn();
        }
        return;
      }

      if (!isModalOpen) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        showPrevImage();
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        showNextImage();
      }
    });

    modalPrev.addEventListener('click', showPrevImage);

    modalNext.addEventListener('click', showNextImage);
</script>

</body></html>
